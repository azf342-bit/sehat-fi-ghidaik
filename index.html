<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صحتك في غذائك</title>
    
    <!-- 1. مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f9f9f9;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #27ae60;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🥗 صحتك في غذائك</h1>
        <p>قائمة الأطعمة والقيم الغذائية</p>
        
        <div id="content">جاري تحميل البيانات...</div>
    </div>

    <!-- 2. كود الاتصال بـ Supabase وعرض الأطعمة -->
    <script>
        const SUPABASE_URL = 'https://zdrpsljimkhbzmknscgw.supabase.co';
        
        // ⚠️ استبدل المفتاح أدناه بمفتاح sb_publishable الذي نسخته للتو
        const SUPABASE_ANON_KEY = 'الصق_مفتاح_sb_publishable_هنا';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadFoods() {
            const contentDiv = document.getElementById('content');

            const { data, error } = await supabaseClient
                .from('foods')
                .select('*');

            if (error) {
                console.error('خطأ في جلب البيانات:', error);
                contentDiv.innerHTML = '<p style="color:red;">حدث خطأ أثناء الاتصال بقاعدة البيانات!</p>';
                return;
            }

            if (!data || data.length === 0) {
                contentDiv.innerHTML = '<p>لا توجد أطعمة مسجلة في قاعدة البيانات حالياً.</p>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>الطعام</th>
                            <th>السعرات</th>
                            <th>بروتين (غ)</th>
                            <th>كارب (غ)</th>
                            <th>دهون (غ)</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(item => {
                html += `
                    <tr>
                        <td><b>${item.name}</b></td>
                        <td>${item.calories}</td>
                        <td>${item.protein}</td>
                        <td>${item.carbs}</td>
                        <td>${item.fats}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            contentDiv.innerHTML = html;
        }

        loadFoods();
    </script>
</body>
</html>
